defaults:
  - _self_

num_envs: 1
freq: 40 # can only be divisible by 200
camera_follow: True
env_name: obstacle-dense
# env_name: full-warehouse

sensor:
  enable_lidar: True
  enable_camera: True
  color_image: True
  depth_image: True
  semantic_segmentation: True
  enable_imu: True
  imu_freq: 200  # Hz
  imu_noise: False
  imu:
    accel_noise_std: 0.02   # m/s^2
    gyro_noise_std: 0.001   # rad/s

sim_app:
  anti_aliasing: 0
  width: 1280
  height: 720
  hide_ui: False